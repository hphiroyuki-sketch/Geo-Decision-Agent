name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/ai-chat-app-build-s7fut7

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build:frontend

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply geo-decision-agent-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket create geo-decision-agent-photos || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secrets are passed as environment variables, never interpolated with
      # ${{ }} inside the script. The service account key is JSON full of double
      # quotes, and inlining it produced broken shell syntax whose failure was
      # swallowed by the surrounding `if`, so the key was silently never set.
      - name: Set Worker secrets
        run: |
          set -euo pipefail
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$APP_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          if [ -n "$EE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Earth Engine service account key: provided (${#EE_SERVICE_ACCOUNT_JSON} chars)"
            printf '%s' "$EE_SERVICE_ACCOUNT_JSON" | npx wrangler secret put EE_SERVICE_ACCOUNT_JSON
          else
            echo "Earth Engine service account key: NOT provided - skipping"
          fi
          if [ -n "$EE_PROJECT_ID" ]; then
            printf '%s' "$EE_PROJECT_ID" | npx wrangler secret put EE_PROJECT_ID
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
